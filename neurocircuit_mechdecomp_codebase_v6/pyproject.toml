[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurocircuit-mechdecomp"
version = "0.1.0"
description = "Transformer–SSM architecture for neurocircuit mechanism decomposition from fMRI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Cole Korponay"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.2",
  "einops>=0.7",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[tool.setuptools]
packages = ["neurocircuit"]
